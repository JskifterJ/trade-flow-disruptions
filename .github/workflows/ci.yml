# Validates the data files and runs the browser smoke tests on every push and PR.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Linux is pinned: ubuntu-latest became 26.04 (Nov 2026), which Playwright 1.56.1 cannot install Chromium on.
    # Windows runs too, so the tests keep working on the owner's Windows PC.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Validate data
        run: npm run validate
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Browser smoke tests
        run: npm run smoke
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.os }}
          path: tests/screenshots/
          if-no-files-found: ignore
